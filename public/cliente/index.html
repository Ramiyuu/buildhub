<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Minha área | BuildHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="stylesheet" href="/panel/panel.css">
  <link rel="stylesheet" href="/chat-widget.css">
  <script src="/theme-boot.js"></script>
</head>
<body class="app no-side">
  <div class="main">
    <header class="topbar">
      <a class="brand" href="/"><span class="brand-mark"><img src="/assets/images/logobranca.png" alt=""></span>BuildHub</a>
      <div class="crumb"></div>
      <button class="icon-btn" id="themeBtn" type="button" aria-label="Alternar tema"><svg class="ic theme-ic-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg><svg class="ic theme-ic-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
      <div class="user-chip"><span class="avatar" id="userAvatar">?</span><div><strong id="userName"></strong><small>Cliente</small></div></div>
      <button class="icon-btn" id="logoutBtn" type="button" aria-label="Sair" title="Sair"><svg class="ic" viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></button>
    </header>
    <main id="view" class="container" tabindex="-1"></main>
  </div>
  <div id="toasts" aria-live="polite"></div>
  <script type="module" src="/cliente/cliente.js"></script>
  <script src="/js/chat-widget.js" defer></script>
</body>
</html>
